# 2G: o PC da loja tem 8 GB no total -- com -Xmx8G o build esgotava a memoria
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m
# compila Kotlin dentro do processo do Gradle (sem um 2o JVM) e com poucos workers
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=2
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
